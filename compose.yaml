name: beacon-forge

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/beacon_forge.db
      - API_KEY=dev-secret-key-change-me
      - OIDC_SERVER_URL=https://oidc.local/realms/beacon-forge
      - OIDC_CLIENT_ID=beacon-forge
      - OIDC_CLIENT_SECRET=
      - OIDC_REDIRECT_URI=http://127.0.0.1:5173/callback
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - keycloak
    restart: unless-stopped
    profiles: ["auth"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL=http://backend:8000
        VITE_API_KEY=dev-secret-key-change-me
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://127.0.0.1:8000
    depends_on:
      - backend
    restart: unless-stopped
    profiles: ["auth"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm
    hostname: keycloak
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/realms/master"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    profiles: ["auth"]

volumes:
  backend-data:
  keycloak-data: